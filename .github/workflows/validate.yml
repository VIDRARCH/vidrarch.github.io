name: Validate VIDRARCH

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate public portfolio
        run: python tools/validate.py

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check site.config.js
